name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: interpretability-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: interpretability-viewer

      - name: Build
        run: npm run build
        working-directory: interpretability-viewer
        env:
          # URL pública del Cloudflare Worker (inyecta el token HF server-side).
          # Se define en Settings > Secrets and variables > Actions > Variables.
          # Si no está seteada, imagenet-pico cae a los assets locales.
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: interpretability-viewer/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5